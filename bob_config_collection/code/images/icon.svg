<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    Activity-bar icon: transparent background, opaque black paths.
    VS Code treats opaque pixels as the mask and tints them with the
    theme foreground colour. Use any fully-opaque colour here; #000000
    is simplest and renders crisply when sharp converts to PNG.
    The colour marketplace image is images/icon-color.svg / icon-color.png.
  -->

  <!-- Three stacked config cards (modes / skills / other) -->
  <rect x="18" y="14" width="68" height="20" rx="6" fill="#000000" transform="rotate(-7 52 24)"/>
  <rect x="22" y="36" width="68" height="20" rx="6" fill="#000000" transform="rotate(4 56 46)"/>
  <rect x="18" y="58" width="68" height="20" rx="6" fill="#000000" transform="rotate(-3 52 68)"/>

  <!-- Import-down chevron -->
  <path d="M46,86 L56,96 L66,86"
        stroke="#000000" stroke-width="7" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tray / workspace target -->
  <path d="M16,96 L16,112 Q16,118 22,118 L90,118 Q96,118 96,112 L96,96"
        stroke="#000000" stroke-width="7" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Community triangle badge -->
  <circle cx="108" cy="96" r="18" stroke="#000000" stroke-width="6" fill="none"/>
  <line x1="108" y1="84"  x2="97"  y2="104" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="108" y1="84"  x2="119" y2="104" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="97"  y1="104" x2="119" y2="104" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="108" cy="84"  r="5" fill="#000000"/>
  <circle cx="97"  cy="104" r="5" fill="#000000"/>
  <circle cx="119" cy="104" r="5" fill="#000000"/>
</svg>
