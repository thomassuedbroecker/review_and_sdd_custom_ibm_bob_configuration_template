<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background rounded square — neutral dark blue (community, not IBM corporate blue) -->
  <rect width="128" height="128" rx="22" ry="22" fill="#1c2b4a"/>

  <!-- Isometric cube top face -->
  <polygon points="64,18 100,38 64,58 28,38" fill="#a6c8ff"/>

  <!-- Isometric cube left face -->
  <polygon points="28,38 28,74 64,94 64,58" fill="#4589ff"/>

  <!-- Isometric cube right face -->
  <polygon points="100,38 100,74 64,94 64,58" fill="#78a9ff"/>

  <!-- Bob "B" letter on top face -->
  <text x="64" y="52" font-family="Arial,sans-serif" font-size="18" font-weight="bold"
        text-anchor="middle" fill="#1c2b4a" opacity="0.6">B</text>

  <!-- Import arrow shaft -->
  <rect x="58" y="85" width="12" height="22" rx="3" fill="#ffffff"/>

  <!-- Import arrow head pointing down -->
  <polygon points="48,102 64,120 80,102" fill="#ffffff"/>

  <!-- Community badge: person silhouette in teal (not IBM green) -->
  <circle cx="100" cy="28" r="13" fill="#0e7c86"/>
  <!-- head -->
  <circle cx="100" cy="23" r="4" fill="#ffffff"/>
  <!-- shoulders -->
  <path d="M91,38 Q100,31 109,38" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
