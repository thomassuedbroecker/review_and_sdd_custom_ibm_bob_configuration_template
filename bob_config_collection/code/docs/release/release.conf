# Release configuration for src/tools/release-vsix.sh
#
# Edit these values before each release. The file is sourced by bash, so use
# bash syntax. Command-line options override these values.

# Release number without the leading "v". The Git tag becomes "v<version>",
# and package.json "version" must have the same value.
RELEASE_VERSION="2.4.1"

# Title shown on the GitHub Release page.
RELEASE_TITLE="v${RELEASE_VERSION} – Prebuilt extension download and usage disclaimer"

# Release comment: the "What's new" part of the release notes (Markdown).
# It replaces {{CHANGES}} in the notes template. The disclaimer, install
# steps, and changelog link come from the template automatically.
RELEASE_CHANGES=$(cat <<'EOF'
### Documentation
- **Download a prebuilt version**: the Bob Config Importer README now explains
  how to download the `.vsix` from GitHub Releases, check its SHA-256
  checksum, and install it. The Releases page also serves as the version history.
- **Disclaimer and license**: new section in the Bob Config Importer README.
  It covers the Apache-2.0 "AS IS" and no-liability terms (§7, §8) and what
  the extension does on your system:
  - writes and replaces files in `.bob/` after you confirm,
  - merges hook entries into `.bob/settings.json`: **imported hooks and
    scripts run code on your machine**, so read them before installing,
  - downloads content from the configured GitHub repository.
- Root README: link to the prebuilt download, with a short usage warning.

No changes to modes, skills, hooks, or extension code.
EOF
)

# Optional: Markdown file used instead of RELEASE_CHANGES (relative to
# bob_config_collection/code/). Leave empty to use RELEASE_CHANGES.
RELEASE_CHANGES_FILE=""

# Notes template (relative to bob_config_collection/code/).
# Placeholders: {{VERSION}} {{TAG}} {{PREVIOUS_TAG}} {{REPO}} {{CHANGES}}
RELEASE_NOTES_TEMPLATE="docs/release/release-notes-template.md"

# Tag used for the changelog link. Leave empty to detect the previous tag.
PREVIOUS_TAG=""

# When the GitHub Release already exists: also replace its title and notes?
# "false" keeps notes you edited on the website and only uploads the files.
UPDATE_EXISTING_NOTES="false"
